# Application
spring.application.name=ebookstore-backend
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ebookstore
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=ebookstore-super-secret-key-capstone-project-2024-secure
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.ebookstore=DEBUG
logging.level.org.springframework.security=INFO
